<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="SPUR AI Research explores sustainability topics using AI agents.">
    <title>SPUR AI Research</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172b24;
        background: #f5f8f6;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(1.5rem, 6vw, 3.5rem);
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.5rem 2rem rgb(23 43 36 / 8%);
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1.1;
        overflow-wrap: anywhere;
      }

      p {
        margin: 1rem 0 0;
        font-size: clamp(1.125rem, 4vw, 1.375rem);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>SPUR AI Research</h1>
      <p>This project is coming soon.</p>
    </main>
  </body>
</html>
