<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Brooklyn Community Kitchen AI Assistant: helping the kitchen's board coordinate volunteer and nonprofit operations.">
    <title>Brooklyn Community Kitchen AI Assistant</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #172b24;
        background: #f5f8f6;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100vh;
        margin: 0;
        padding: 1.5rem;
        place-items: center;
      }

      main {
        width: min(100%, 42rem);
        padding: clamp(1.5rem, 6vw, 3.5rem);
        border-radius: 1rem;
        background: #fff;
        box-shadow: 0 0.5rem 2rem rgb(23 43 36 / 8%);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 7vw, 3rem);
        line-height: 1.15;
        overflow-wrap: anywhere;
      }

      p {
        margin: 1rem 0 0;
        font-size: clamp(1.0625rem, 4vw, 1.25rem);
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Brooklyn Community Kitchen AI Assistant</h1>
      <p>The Brooklyn Community Kitchen AI Assistant helps the kitchen's five operating board members and a part-time helper coordinate volunteer and nonprofit operations so they can run the kitchen's work more easily.</p>
    </main>
  </body>
</html>
